<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>브레인스토밍 보드</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --ink: #37352F; --mute: #787774; --mute-2: #B4B2AD;
  --line: #EDECE9; --line-2: #E0DEDA; --bg: #FBFAF9; --surface: #FFFFFF;
  --coral: #FF7A6B; --accent: #2383E2;
  --go: #6BCB77; --eat: #FFB067; --do: #A78BFA; --maybe: #94A3B8; --idea: #F9C74F;
  --shadow: 0 1px 3px rgba(0,0,0,0.06); --shadow-l: 0 8px 24px rgba(0,0,0,0.1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* 헤더 */
.board-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.board-header-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
.back-btn { font-size: 18px; padding: 6px 10px; border: none; background: none; cursor: pointer; color: var(--mute); border-radius: 6px; }
.back-btn:hover { background: var(--bg); }
.board-title { font-family: 'Instrument Serif', serif; font-size: 24px; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board-sub { font-size: 12px; color: var(--mute); margin-top: 1px; }
.board-header-right { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.btn { padding: 8px 14px; border-radius: 8px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; }
.btn-primary { background: var(--ink); color: #fff; }
.btn-primary:hover { background: #000; }
.btn-ghost { background: var(--bg); color: var(--mute); border: 1px solid var(--line); }
.btn-ghost:hover { color: var(--ink); }

/* 아이디어 던지기 입력 */
.throw-bar { display: flex; gap: 8px; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; align-items: center; }
.throw-input { flex: 1; padding: 11px 14px; border: 1.5px solid var(--line-2); border-radius: 10px; font-size: 14px; font-family: inherit; background: var(--bg); }
.throw-input:focus { outline: none; border-color: var(--coral); background: #fff; }
.mood-pick { display: flex; gap: 5px; }
.mood-chip { padding: 7px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; cursor: pointer; border: 1.5px solid transparent; background: var(--bg); color: var(--mute); transition: all .12s; user-select: none; white-space: nowrap; }
.mood-chip.active { color: #fff; }
.mood-chip[data-m="가고싶어"].active { background: var(--go); }
.mood-chip[data-m="먹고싶어"].active { background: var(--eat); }
.mood-chip[data-m="하고싶어"].active { background: var(--do); }
.mood-chip[data-m="후보"].active { background: var(--maybe); }

/* 보드 컬럼 영역 */
.board-scroll { flex: 1; overflow-x: auto; overflow-y: hidden; padding: 18px 20px; }
.board-cols { display: flex; gap: 16px; height: 100%; min-width: min-content; }
.board-col { width: 300px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; max-height: 100%; }
.board-col.drag-over { border-color: var(--coral); border-width: 2px; background: #FFF8F6; }
.col-head { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.col-title { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 800; }
.col-dot { width: 10px; height: 10px; border-radius: 50%; }
.col-count { font-size: 12px; color: var(--mute-2); font-weight: 700; }
.col-body { flex: 1; overflow-y: auto; padding: 4px 12px 12px; display: flex; flex-direction: column; gap: 9px; }
.col-empty { text-align: center; color: var(--mute-2); font-size: 12.5px; padding: 24px 8px; line-height: 1.6; }

/* 카드 */
.card { background: var(--surface); border: 1px solid var(--line-2); border-radius: 11px; padding: 11px 12px; cursor: grab; transition: box-shadow .15s, transform .1s; position: relative; }
.card:hover { box-shadow: var(--shadow); }
.card:active { cursor: grabbing; }
.card.dragging { opacity: 0.4; }
.card-img { width: 100%; height: 90px; object-fit: cover; border-radius: 7px; margin-bottom: 8px; background: var(--bg); }
.card-name { font-size: 13.5px; font-weight: 700; line-height: 1.35; margin-bottom: 3px; word-break: break-word; }
.card-meta { font-size: 11px; color: var(--mute); margin-bottom: 8px; }
.card-idea-badge { display: inline-block; font-size: 10px; font-weight: 700; color: #a06d00; background: #FEF3C7; padding: 1px 7px; border-radius: 999px; margin-bottom: 6px; }
.card-x { position: absolute; top: 7px; right: 7px; width: 22px; height: 22px; border-radius: 50%; border: none; background: rgba(255,255,255,0.8); color: #999; font-size: 13px; cursor: pointer; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.card:hover .card-x { display: flex; }
.card-x:hover { background: rgba(220,50,50,0.85); color: #fff; }

/* 반응 */
.reactions { display: flex; gap: 4px; flex-wrap: wrap; }
.react-btn { display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--bg); font-size: 12px; cursor: pointer; transition: all .12s; user-select: none; }
.react-btn:hover { border-color: var(--mute); }
.react-btn.mine { background: #FFF0EC; border-color: var(--coral); }
.react-count { font-size: 11px; font-weight: 700; color: var(--mute); }
.react-btn.mine .react-count { color: var(--coral); }

/* 확정 버튼 */
.card-confirm { margin-top: 8px; width: 100%; padding: 6px; border-radius: 7px; border: 1px dashed var(--line-2); background: none; color: var(--mute); font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all .12s; }
.card-confirm:hover { border-color: var(--go); color: var(--go); border-style: solid; }
.card-confirm.confirmed { background: #F0FAF1; border-color: var(--go); color: var(--go); border-style: solid; }

.loading-screen { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 14px; }

@media (max-width: 720px) {
  .throw-bar { flex-wrap: wrap; }
  .throw-input { min-width: 100%; }
  .board-col { width: 260px; }
  .board-title { font-size: 20px; }
}
</style>
</head>
<body>

<div class="board-header">
  <div class="board-header-left">
    <button class="back-btn" onclick="goBack()">&larr;</button>
    <div style="min-width:0;">
      <div class="board-title" id="trip-name">브레인스토밍</div>
      <div class="board-sub" id="trip-sub">아이디어를 마구 던져보세요</div>
    </div>
  </div>
  <div class="board-header-right">
    <button class="btn btn-primary" onclick="goItinerary()">&#x1F4C5; 일정으로</button>
  </div>
</div>

<div class="throw-bar">
  <input type="text" class="throw-input" id="throw-input" placeholder="가고 싶은 곳, 하고 싶은 것, 그냥 떠오른 생각... 뭐든 던져보세요" autocomplete="off" />
  <div class="mood-pick" id="mood-pick">
    <span class="mood-chip active" data-m="가고싶어">가고싶어</span>
    <span class="mood-chip" data-m="먹고싶어">먹고싶어</span>
    <span class="mood-chip" data-m="하고싶어">하고싶어</span>
    <span class="mood-chip" data-m="후보">후보</span>
  </div>
  <button class="btn btn-primary" onclick="throwIdea()">던지기</button>
</div>

<div class="board-scroll" id="board-scroll">
  <div class="loading-screen" id="loading">불러오는 중...</div>
  <div class="board-cols" id="board-cols" style="display:none;"></div>
</div>

<script>
const SUPABASE_URL = 'https://izmlenodqnvisymjnlyg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_v_ScByLsW_mC5Pzoyx1iAw_J2V0SGkR';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const MOODS = ['가고싶어', '먹고싶어', '하고싶어', '후보'];
const MOOD_DOT = { '가고싶어':'var(--go)', '먹고싶어':'var(--eat)', '하고싶어':'var(--do)', '후보':'var(--maybe)' };
const MOOD_ICON = { '가고싶어':'&#x1F4CD;', '먹고싶어':'&#x1F37D;', '하고싶어':'✨', '후보':'&#x1F914;' };
const REACTIONS = ['&#x1F44D;', '&#x1F914;', '❤️', '&#x1F525;'];

let tripId = null, user = null, selectedMood = '가고싶어';
let places = [], reactions = [];

// URL에서 trip id 파싱
function getTripId() {
  return new URLSearchParams(location.search).get('trip');
}

function goBack() { location.href = '/index.html'; }
function goItinerary() { location.href = `/index.html?trip=${tripId}`; }

// 무드 선택
$('#mood-pick').addEventListener('click', (e) => {
  const chip = e.target.closest('.mood-chip');
  if (!chip) return;
  document.querySelectorAll('.mood-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  selectedMood = chip.dataset.m;
});

// 엔터로 던지기
$('#throw-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') throwIdea();
});

// 아이디어 던지기
async function throwIdea() {
  const input = $('#throw-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const { data, error } = await sb.from('places').insert({
    trip_id: tripId,
    name: text,
    mood: selectedMood,
    status: 'idea',
    is_idea: true,
    added_by: user.id,
  }).select().single();

  if (error) { alert('던지기 실패: ' + error.message); return; }
  places.unshift(data);
  render();
}

// 카드 삭제
async function deleteCard(id) {
  if (!confirm('이 카드를 지울까요?')) return;
  await sb.from('places').delete().eq('id', id);
  places = places.filter(p => p.id !== id);
  render();
}

// 무드 변경 (드래그 이동)
async function moveCard(id, newMood) {
  const p = places.find(x => x.id === id);
  if (!p || p.mood === newMood) return;
  p.mood = newMood;
  render();
  await sb.from('places').update({ mood: newMood }).eq('id', id);
}

// 확정 토글
async function toggleConfirm(id) {
  const p = places.find(x => x.id === id);
  if (!p) return;
  p.status = p.status === 'confirmed' ? 'idea' : 'confirmed';
  render();
  await sb.from('places').update({ status: p.status }).eq('id', id);
}

// 반응 토글
async function toggleReaction(placeId, emoji) {
  const existing = reactions.find(r => r.place_id === placeId && r.user_id === user.id && r.emoji === emoji);
  if (existing) {
    reactions = reactions.filter(r => r !== existing);
    render();
    await sb.from('place_reactions').delete().eq('place_id', placeId).eq('user_id', user.id).eq('emoji', emoji);
  } else {
    const newR = { place_id: placeId, user_id: user.id, emoji };
    reactions.push(newR);
    render();
    await sb.from('place_reactions').insert(newR);
  }
}

// 드래그 앤 드롭
let draggedId = null;
function onDragStart(e, id) { draggedId = id; e.target.classList.add('dragging'); }
function onDragEnd(e) { e.target.classList.remove('dragging'); draggedId = null; document.querySelectorAll('.board-col').forEach(c => c.classList.remove('drag-over')); }
function onDragOver(e, mood) { e.preventDefault(); }
function onDrop(e, mood) { e.preventDefault(); if (draggedId) moveCard(draggedId, mood); }

// 렌더링
function render() {
  const cols = $('#board-cols');
  cols.innerHTML = MOODS.map(mood => {
    const items = places.filter(p => p.mood === mood);
    return `
      <div class="board-col" ondragover="onDragOver(event,'${mood}')" ondrop="onDrop(event,'${mood}')"
           ondragenter="this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')">
        <div class="col-head">
          <div class="col-title">
            <span class="col-dot" style="background:${MOOD_DOT[mood]}"></span>
            ${MOOD_ICON[mood]} ${mood}
          </div>
          <span class="col-count">${items.length}</span>
        </div>
        <div class="col-body">
          ${items.length ? items.map(renderCard).join('') : `<div class="col-empty">아직 없어요.<br>위에서 아이디어를 던져보세요</div>`}
        </div>
      </div>`;
  }).join('');

  // 드래그 이벤트 바인딩
  cols.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    card.setAttribute('draggable', 'true');
    card.addEventListener('dragstart', e => onDragStart(e, id));
    card.addEventListener('dragend', onDragEnd);
  });
}

function renderCard(p) {
  const isConfirmed = p.status === 'confirmed';
  const photo = p.photo_url ? `<img class="card-img" src="${p.photo_url}" onerror="this.remove()" />` : '';
  const meta = !p.is_idea && p.category ? `<div class="card-meta">${esc(p.category)}</div>` : '';
  const ideaBadge = p.is_idea ? `<span class="card-idea-badge">&#x1F4AD; 아이디어</span>` : '';

  // 반응 렌더
  const reactHtml = REACTIONS.map(emoji => {
    const rs = reactions.filter(r => r.place_id === p.id && r.emoji === emoji);
    const mine = rs.some(r => r.user_id === user.id);
    if (rs.length === 0 && !mine) {
      return `<span class="react-btn" onclick="toggleReaction('${p.id}','${emoji}')">${emoji}</span>`;
    }
    return `<span class="react-btn ${mine ? 'mine' : ''}" onclick="toggleReaction('${p.id}','${emoji}')">${emoji}<span class="react-count">${rs.length}</span></span>`;
  }).join('');

  return `
    <div class="card" data-id="${p.id}">
      <button class="card-x" onclick="deleteCard('${p.id}')">×</button>
      ${photo}
      ${ideaBadge}
      <div class="card-name">${esc(p.name)}</div>
      ${meta}
      <div class="reactions">${reactHtml}</div>
      <button class="card-confirm ${isConfirmed ? 'confirmed' : ''}" onclick="toggleConfirm('${p.id}')">
        ${isConfirmed ? '✓ 가기로 했어요' : '가기로 정하기'}
      </button>
    </div>`;
}

// 초기화
async function init() {
  tripId = getTripId();
  if (!tripId) { $('#loading').textContent = '여행 정보가 없어요. 목록으로 돌아가세요.'; return; }

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = '/index.html'; return; }
  user = session.user;

  // 여행 정보
  const { data: trip } = await sb.from('trips').select('name, destinations').eq('id', tripId).single();
  if (trip) {
    $('#trip-name').textContent = trip.name || '브레인스토밍';
    $('#trip-sub').textContent = (trip.destinations || []).join(', ') || '아이디어를 마구 던져보세요';
  }

  // 장소 로드
  const placeRes = await sb.from('places').select('*').eq('trip_id', tripId).order('created_at', { ascending: false });
  places = (placeRes.data || []).map(p => ({ ...p, mood: p.mood || '후보' }));

  // 반응은 이 여행의 place들 기준으로 가져오기
  const placeIds = places.map(p => p.id);
  if (placeIds.length) {
    const { data: rdata } = await sb.from('place_reactions').select('place_id, user_id, emoji').in('place_id', placeIds);
    reactions = rdata || [];
  }

  $('#loading').style.display = 'none';
  $('#board-cols').style.display = 'flex';
  render();

  // 실시간 구독
  sb.channel('board-' + tripId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'places', filter: `trip_id=eq.${tripId}` }, reload)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'place_reactions' }, reload)
    .subscribe();
}

let reloadTimer = null;
async function reload() {
  clearTimeout(reloadTimer);
  reloadTimer = setTimeout(async () => {
    const { data } = await sb.from('places').select('*').eq('trip_id', tripId).order('created_at', { ascending: false });
    places = (data || []).map(p => ({ ...p, mood: p.mood || '후보' }));
    const placeIds = places.map(p => p.id);
    if (placeIds.length) {
      const { data: rdata } = await sb.from('place_reactions').select('place_id, user_id, emoji').in('place_id', placeIds);
      reactions = rdata || [];
    }
    render();
  }, 300);
}

init();
</script>
</body>
</html>
