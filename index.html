<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>여로 · Trip Planner</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
  /* ===== Design tokens ===== */
  :root {
    --bg:        #FAFAF7;
    --surface:   #FFFFFF;
    --ink:       #1A1A1A;
    --mute:      #6B6B68;
    --mute-2:    #A8A8A3;
    --line:      #EAE8E2;
    --line-2:    #D6D4CD;
    --accent:    #0F4C5C;
    --accent-h:  #0a3a47;
    --warm:      #C26B3D;
    --error:     #B23A3A;

    --r:   6px;
    --r-l: 10px;
    --shadow:   0 1px 2px rgba(0,0,0,0.04);
    --shadow-l: 0 8px 24px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }

  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ===== Buttons ===== */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px;
    border-radius: var(--r);
    font-weight: 500;
    font-size: 13px;
    transition: background .15s, color .15s, border-color .15s, opacity .15s;
    white-space: nowrap;
    user-select: none;
  }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #000; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
  .btn-secondary:hover { border-color: var(--ink); }
  .btn-ghost { color: var(--mute); padding: 8px 10px; }
  .btn-ghost:hover { color: var(--ink); background: var(--bg); border-radius: var(--r); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  /* ===== Inputs ===== */
  .input {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--r);
    border: 1px solid var(--line-2);
    background: var(--surface);
    transition: border-color .15s, background .15s;
  }
  .input:focus { outline: none; border-color: var(--ink); }
  .input::placeholder { color: var(--mute-2); }

  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--mute);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }

  /* ===== Screens ===== */
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }

  /* Auth */
  #screen-auth {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .auth-card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border-radius: var(--r-l);
    padding: 36px 32px;
    border: 1px solid var(--line);
  }
  .auth-title { font-size: 44px; line-height: 1; margin: 0 0 8px; }
  .auth-subtitle { color: var(--mute); margin: 0 0 24px; font-size: 14px; }

  /* Trips list */
  #screen-trips {
    flex-direction: column;
    padding: 48px 24px 80px;
    align-items: center;
  }
  .trips-wrap { width: 100%; max-width: 720px; }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-title { font-size: 52px; line-height: 1; margin: 0; }
  .header-actions { display: flex; gap: 8px; }

  .trip-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-l);
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .trip-card:hover { border-color: var(--ink); }
  .trip-card h3 { font-family: 'Instrument Serif', serif; font-size: 26px; font-weight: 400; margin: 0 0 4px; }
  .trip-card .meta { color: var(--mute); font-size: 13px; }
  .trip-card .arrow { color: var(--mute-2); font-size: 18px; }

  /* App */
  #screen-app {
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    flex-shrink: 0;
    gap: 12px;
  }
  .h-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .h-right { display: flex; align-items: center; gap: 10px; }
  .trip-name { font-size: 22px; line-height: 1.1; }
  .trip-meta { color: var(--mute); font-size: 12px; }

  .member-stack { display: flex; }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
    border: 2px solid var(--surface);
    margin-left: -8px;
  }
  .avatar:first-child { margin-left: 0; }

  .app-body { display: flex; flex: 1; overflow: hidden; }

  .panel { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .panel-left   { width: 340px; border-right: 1px solid var(--line); flex-shrink: 0; }
  .panel-center { flex: 1; min-width: 0; background: var(--bg); }
  .panel-right  { width: 42%; min-width: 360px; border-left: 1px solid var(--line); }

  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--surface);
  }
  .panel-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--mute);
  }
  .panel-count {
    font-size: 11px;
    color: var(--mute-2);
    font-weight: 500;
  }
  .panel-content { flex: 1; overflow-y: auto; }

  /* Search bar */
  .search-wrap { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .search-input {
    width: 100%;
    padding: 10px 12px 10px 34px;
    border-radius: var(--r);
    border: 1px solid var(--line-2);
    background: var(--bg);
    transition: border-color .15s, background .15s;
  }
  .search-input:focus { outline: none; background: var(--surface); border-color: var(--ink); }
  .search-icon {
    position: absolute;
    margin-left: 10px;
    margin-top: 11px;
    color: var(--mute-2);
    pointer-events: none;
  }

  /* Place cards */
  .place-card {
    display: flex;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background .15s;
    position: relative;
    align-items: center;
  }
  .place-card:hover { background: var(--bg); }
  .place-card[draggable="true"] { cursor: grab; }
  .place-card[draggable="true"]:active { cursor: grabbing; }
  .place-thumb {
    width: 56px; height: 56px;
    border-radius: var(--r);
    background: var(--line) center/cover no-repeat;
    flex-shrink: 0;
  }
  .place-thumb.placeholder {
    display: flex; align-items: center; justify-content: center;
    color: var(--mute-2); font-size: 18px;
  }
  .place-info { flex: 1; min-width: 0; }
  .place-name {
    font-weight: 500; font-size: 13px;
    margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .place-addr {
    font-size: 11.5px; color: var(--mute);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .place-actions { display: flex; gap: 4px; flex-shrink: 0; }

  /* Itinerary */
  .itin-wrap {
    display: flex;
    gap: 16px;
    padding: 18px;
    overflow-x: auto;
    height: 100%;
    align-items: flex-start;
  }
  .day-col {
    flex: 0 0 280px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-l);
    display: flex; flex-direction: column;
    max-height: 100%;
    box-shadow: var(--shadow);
  }
  .day-head {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .day-num {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .day-date { font-size: 22px; line-height: 1; margin-top: 2px; }
  .day-weekday { color: var(--mute); font-size: 12px; }

  .day-items {
    padding: 8px;
    overflow-y: auto;
    flex: 1;
    min-height: 80px;
    transition: background .15s;
  }
  .day-items.drag-over { background: rgba(15, 76, 92, 0.06); }
  .day-empty {
    color: var(--mute-2);
    font-size: 12px;
    padding: 24px 10px;
    text-align: center;
    border: 1px dashed var(--line-2);
    border-radius: var(--r);
    margin: 4px;
  }

  .itin-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 10px 12px;
    margin-bottom: 6px;
    cursor: grab;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: border-color .15s;
  }
  .itin-item:hover { border-color: var(--line-2); }
  .itin-item:active { cursor: grabbing; }
  .itin-item-body { flex: 1; min-width: 0; }
  .itin-item-name {
    font-weight: 500;
    font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .itin-item-time {
    font-size: 11px;
    color: var(--mute);
  }
  .itin-x {
    color: var(--mute-2);
    padding: 4px;
    border-radius: 4px;
    line-height: 1;
    font-size: 16px;
    flex-shrink: 0;
  }
  .itin-x:hover { color: var(--error); background: rgba(178,58,58,0.08); }

  /* Map */
  #map { width: 100%; height: 100%; background: var(--line); }
  .leaflet-popup-content { font-family: inherit; font-size: 13px; }

  /* Modal */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 1000;
    align-items: center; justify-content: center;
    padding: 20px;
    animation: fadein .15s;
  }
  .modal-bg.active { display: flex; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--surface);
    border-radius: var(--r-l);
    max-width: 460px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
    box-shadow: var(--shadow-l);
  }
  .modal h2 { font-family: 'Instrument Serif', serif; font-size: 30px; font-weight: 400; margin: 0 0 6px; }
  .modal .lede { color: var(--mute); margin: 0 0 20px; font-size: 13px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  /* Empty */
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--mute-2);
    font-size: 13px;
  }
  .empty-sm { padding: 20px; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    padding: 10px 18px;
    border-radius: var(--r);
    font-size: 13px;
    z-index: 2000;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    box-shadow: var(--shadow-l);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Loader */
  .loader {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--line-2);
    border-top-color: var(--ink);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Mobile */
  .mobile-tabs { display: none; }
  @media (max-width: 820px) {
    .panel-left, .panel-right { display: none; }
    .panel-left.m-active, .panel-right.m-active {
      display: flex;
      position: fixed;
      inset: 53px 0 49px 0;
      width: 100%;
      z-index: 50;
    }
    .mobile-tabs {
      display: flex;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-top: 1px solid var(--line);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mobile-tab {
      flex: 1;
      padding: 12px 8px;
      text-align: center;
      font-size: 12px;
      color: var(--mute);
      font-weight: 500;
    }
    .mobile-tab.active { color: var(--accent); font-weight: 600; }
    .app-body { padding-bottom: 49px; }
    .page-title { font-size: 36px; }
    .auth-title { font-size: 36px; }
  }
</style>
</head>
<body>

<!-- ===================== AUTH ===================== -->
<div id="screen-auth" class="screen active">
  <div class="auth-card">
    <h1 class="serif auth-title">여로</h1>
    <p class="auth-subtitle">친구들과 함께 짜는 여행 계획</p>

    <div class="field">
      <label>이메일</label>
      <input type="email" class="input" id="auth-email" placeholder="you@example.com" autocomplete="email" />
    </div>

    <button class="btn btn-primary btn-block" id="btn-magic">매직 링크 받기</button>

    <p style="font-size: 12px; color: var(--mute); margin: 16px 0 0; text-align: center;">
      이메일로 로그인 링크가 전송됩니다
    </p>
  </div>
</div>

<!-- ===================== TRIPS LIST ===================== -->
<div id="screen-trips" class="screen">
  <div class="trips-wrap">
    <div class="page-header">
      <h1 class="serif page-title">나의 여행</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" id="btn-join">초대 코드</button>
        <button class="btn btn-primary" id="btn-new-trip">+ 새 여행</button>
      </div>
    </div>
    <div id="trips-list"></div>
    <div style="margin-top: 32px; text-align: center;">
      <button class="btn btn-ghost" id="btn-logout">로그아웃</button>
    </div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="screen-app" class="screen">
  <header class="app-header">
    <div class="h-left">
      <button class="btn btn-ghost" id="btn-back" title="여행 목록">←</button>
      <div style="min-width: 0;">
        <div class="serif trip-name" id="current-name"></div>
        <div class="trip-meta" id="current-meta"></div>
      </div>
    </div>
    <div class="h-right">
      <div class="member-stack" id="member-stack"></div>
      <button class="btn btn-secondary btn-sm" id="btn-invite">초대</button>
    </div>
  </header>

  <div class="app-body">
    <!-- LEFT: search + saved -->
    <aside class="panel panel-left" id="panel-left">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" class="search-input" id="search-input" placeholder="가고 싶은 곳을 검색하세요" />
      </div>
      <div class="panel-content">
        <div id="search-results"></div>
        <div class="panel-header">
          <span class="panel-title">저장한 장소</span>
          <span class="panel-count" id="saved-count">0</span>
        </div>
        <div id="saved-list"></div>
      </div>
    </aside>

    <!-- CENTER: itinerary -->
    <main class="panel panel-center">
      <div class="itin-wrap" id="itin-wrap"></div>
    </main>

    <!-- RIGHT: map -->
    <aside class="panel panel-right" id="panel-right">
      <div id="map"></div>
    </aside>
  </div>

  <div class="mobile-tabs">
    <button class="mobile-tab active" data-tab="itin">일정</button>
    <button class="mobile-tab" data-tab="places">장소</button>
    <button class="mobile-tab" data-tab="map">지도</button>
  </div>
</div>

<!-- ===================== MODALS ===================== -->
<div class="modal-bg" id="modal-new-trip">
  <div class="modal">
    <h2>새 여행 만들기</h2>
    <p class="lede">언제 어디로 떠나시나요?</p>
    <div class="field">
      <label>여행 이름</label>
      <input type="text" class="input" id="nt-name" placeholder="방콕 · 푸켓" />
    </div>
    <div class="row">
      <div class="field">
        <label>시작일</label>
        <input type="date" class="input" id="nt-start" />
      </div>
      <div class="field">
        <label>종료일</label>
        <input type="date" class="input" id="nt-end" />
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>취소</button>
      <button class="btn btn-primary" id="btn-create-trip">만들기</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-join">
  <div class="modal">
    <h2>여행 합류</h2>
    <p class="lede">친구가 보내준 초대 코드를 입력하세요</p>
    <div class="field">
      <label>초대 코드</label>
      <input type="text" class="input" id="jc-code" placeholder="abc12345" autocapitalize="off" autocomplete="off" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" data-close>취소</button>
      <button class="btn btn-primary" id="btn-do-join">합류</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="modal-invite">
  <div class="modal">
    <h2>친구 초대</h2>
    <p class="lede">이 링크를 친구에게 보내세요</p>
    <div class="field">
      <label>초대 링크</label>
      <input type="text" class="input" id="inv-link" readonly />
    </div>
    <div class="field">
      <label>또는 초대 코드</label>
      <input type="text" class="input" id="inv-code" readonly style="font-family: ui-monospace, monospace;" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="btn-copy-link">링크 복사</button>
      <button class="btn btn-primary" data-close>확인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- ===================== LIBS ===================== -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ===================================================================
   여로 (Yeoro) - Travel Planner
   단일 파일 SPA. 외부 의존성은 모두 CDN.
   =================================================================== */

/* ---------- CONFIG (본인 키로 교체) ---------- */
const SUPABASE_URL      = 'https://izmlenodqnvisymjnlyg.supabase.co';    // ex) https://xxxxx.supabase.co
const SUPABASE_ANON_KEY = 'sb_publishable_v_ScByLsW_mC5Pzoyx1iAw_J2V0SGkR';   // anon public key
const UNSPLASH_KEY      = 'y8zaLXqn8MAstRZBhktkfXS5DMCr06om2JFpC3-tkJw'; // 비워두면 사진 없이 동작

/* ---------- STATE ---------- */
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let user = null;
let currentTrip = null;
let savedPlaces = [];
let itinerary = [];
let members = [];
let map = null;
let mapMarkers = [];
let mapInited = false;
let realtimeChannel = null;
let searchTimer = null;
let lastQuery = '';
const photoCache = {};

/* ---------- UTILS ---------- */
const $  = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function toast(msg, ms=2200) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), ms);
}

function showScreen(id) {
  $$('.screen').forEach(s => s.classList.remove('active'));
  $('#' + id).classList.add('active');
}

function openModal(id) { $('#' + id).classList.add('active'); }
function closeModal(id) { $('#' + id).classList.remove('active'); }

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getMonth()+1}월 ${dt.getDate()}일`;
}
function fmtDateRange(s, e) {
  if (!s && !e) return '날짜 미정';
  if (!s) return `~ ${fmtDate(e)}`;
  if (!e) return `${fmtDate(s)} ~`;
  return `${fmtDate(s)} – ${fmtDate(e)}`;
}
function daysBetween(s, e) {
  const start = new Date(s + 'T00:00:00');
  const end   = new Date(e + 'T00:00:00');
  const out = [];
  const cur = new Date(start);
  while (cur <= end) {
    out.push(cur.toISOString().split('T')[0]);
    cur.setDate(cur.getDate() + 1);
  }
  return out;
}
const WEEKDAY = ['일','월','화','수','목','금','토'];

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function avatarColor(id) {
  const colors = ['#0F4C5C', '#C26B3D', '#5C7A4A', '#7A4A6E', '#3D5E8C', '#8C6B3D'];
  let h = 0;
  for (const c of String(id || '')) h = ((h << 5) - h + c.charCodeAt(0)) >>> 0;
  return colors[h % colors.length];
}

function initials(id) { return String(id || '?').substring(0, 2).toUpperCase(); }

/* ---------- AUTH ---------- */
async function bootstrap() {
  // 키가 설정되지 않았으면 안내
  if (SUPABASE_URL === 'YOUR_SUPABASE_URL') {
    document.body.innerHTML = `
      <div style="max-width: 580px; margin: 80px auto; padding: 40px; font-family: 'Inter', sans-serif; background:#fff; border-radius:10px; border:1px solid #E8E6E0;">
        <h2 style="font-family: 'Instrument Serif', serif; font-size: 32px; margin: 0 0 12px;">설정이 필요합니다</h2>
        <p style="color:#6B6B68; line-height:1.6;">
          파일을 열어 상단의 <code style="background:#FAFAF7; padding:2px 6px; border-radius:4px;">SUPABASE_URL</code>,
          <code style="background:#FAFAF7; padding:2px 6px; border-radius:4px;">SUPABASE_ANON_KEY</code>,
          <code style="background:#FAFAF7; padding:2px 6px; border-radius:4px;">UNSPLASH_KEY</code>를
          본인 값으로 교체한 뒤 다시 열어주세요. 자세한 절차는 README를 참고하세요.
        </p>
      </div>`;
    return;
  }

  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    user = session.user;
    await processPendingInvite();
    await loadTrips();
    showScreen('screen-trips');
  } else {
    // 초대 링크로 들어왔으면 보관
    const code = new URLSearchParams(location.search).get('join');
    if (code) localStorage.setItem('pending_join', code);
    showScreen('screen-auth');
  }
}

async function processPendingInvite() {
  const fromUrl = new URLSearchParams(location.search).get('join');
  const fromLS  = localStorage.getItem('pending_join');
  const code = fromUrl || fromLS;
  if (!code) return;
  const { error } = await sb.rpc('join_trip_by_code', { _code: code });
  if (!error) {
    toast('여행에 합류했습니다');
  }
  localStorage.removeItem('pending_join');
  if (fromUrl) history.replaceState({}, '', location.pathname);
}

$('#btn-magic').onclick = async () => {
  const email = $('#auth-email').value.trim();
  if (!email) { toast('이메일을 입력하세요'); return; }
  const btn = $('#btn-magic');
  btn.disabled = true;
  btn.innerHTML = '<span class="loader"></span> 전송 중';

  const code = new URLSearchParams(location.search).get('join');
  if (code) localStorage.setItem('pending_join', code);
  const { error } = await sb.auth.signInWithOtp({ email });

  btn.disabled = false;
  btn.textContent = '매직 링크 받기';
  if (error) toast(error.message);
  else toast('이메일을 확인하세요');
};

$('#btn-logout').onclick = async () => {
  await sb.auth.signOut();
  user = null;
  currentTrip = null;
  showScreen('screen-auth');
};

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && !user) {
    user = session.user;
    bootstrap();
  }
});

/* ---------- TRIPS LIST ---------- */
async function loadTrips() {
  const { data, error } = await sb
    .from('trips')
    .select('*')
    .order('created_at', { ascending: false });

  const list = $('#trips-list');
  if (error) { list.innerHTML = `<div class="empty">불러오기 오류: ${esc(error.message)}</div>`; return; }
  if (!data || data.length === 0) {
    list.innerHTML = `<div class="empty">아직 여행이 없습니다. 첫 여행을 만들어보세요.</div>`;
    return;
  }
  list.innerHTML = data.map(t => `
    <div class="trip-card" data-id="${t.id}">
      <div>
        <h3>${esc(t.name)}</h3>
        <div class="meta">${esc(fmtDateRange(t.start_date, t.end_date))}</div>
      </div>
      <div class="arrow">→</div>
    </div>
  `).join('');
  list.querySelectorAll('.trip-card').forEach(el => {
    el.onclick = () => openTrip(el.dataset.id);
  });
}

$('#btn-new-trip').onclick = () => {
  $('#nt-name').value = '';
  $('#nt-start').value = '';
  $('#nt-end').value = '';
  openModal('modal-new-trip');
  setTimeout(() => $('#nt-name').focus(), 100);
};

$('#btn-create-trip').onclick = async () => {
  const name  = $('#nt-name').value.trim();
  const start = $('#nt-start').value || null;
  const end   = $('#nt-end').value || null;
  if (!name) { toast('이름을 입력하세요'); return; }
  if (start && end && start > end) { toast('종료일이 시작일보다 빠릅니다'); return; }

  const { data, error } = await sb.from('trips').insert({
    name, start_date: start, end_date: end, owner_id: user.id
  }).select().single();

  if (error) { toast(error.message); return; }
  closeModal('modal-new-trip');
  await openTrip(data.id);
};

$('#btn-join').onclick = () => {
  $('#jc-code').value = '';
  openModal('modal-join');
  setTimeout(() => $('#jc-code').focus(), 100);
};

$('#btn-do-join').onclick = async () => {
  const code = $('#jc-code').value.trim();
  if (!code) return;
  const { data, error } = await sb.rpc('join_trip_by_code', { _code: code });
  if (error) { toast('초대 코드가 유효하지 않습니다'); return; }
  closeModal('modal-join');
  await openTrip(data);
};

/* ---------- OPEN TRIP ---------- */
async function openTrip(tripId) {
  const { data: trip, error } = await sb.from('trips').select('*').eq('id', tripId).single();
  if (error || !trip) { toast('여행을 불러올 수 없습니다'); return; }
  currentTrip = trip;

  $('#current-name').textContent = trip.name;
  $('#current-meta').textContent = fmtDateRange(trip.start_date, trip.end_date);

  showScreen('screen-app');

  await Promise.all([loadMembers(), loadSavedPlaces(), loadItinerary()]);

  ensureMap();
  renderSaved();
  renderItinerary();
  renderMarkers();
  subscribeRealtime();
}

$('#btn-back').onclick = async () => {
  if (realtimeChannel) { await sb.removeChannel(realtimeChannel); realtimeChannel = null; }
  if (map) { map.remove(); map = null; mapMarkers = []; mapInited = false; }
  currentTrip = null;
  $('#search-input').value = '';
  $('#search-results').innerHTML = '';
  await loadTrips();
  showScreen('screen-trips');
};

/* ---------- MEMBERS ---------- */
async function loadMembers() {
  const { data } = await sb.from('trip_members')
    .select('user_id, role')
    .eq('trip_id', currentTrip.id);
  members = data || [];
  const stack = $('#member-stack');
  const shown = members.slice(0, 4);
  stack.innerHTML = shown.map(m =>
    `<div class="avatar" style="background:${avatarColor(m.user_id)}" title="${esc(m.user_id)}">${initials(m.user_id)}</div>`
  ).join('') + (members.length > 4
    ? `<div class="avatar" style="background:var(--mute);">+${members.length - 4}</div>`
    : '');
}

/* ---------- INVITE ---------- */
$('#btn-invite').onclick = () => {
  const link = `${location.origin}${location.pathname}?join=${currentTrip.invite_code}`;
  $('#inv-link').value = link;
  $('#inv-code').value = currentTrip.invite_code;
  openModal('modal-invite');
};

/* ---------- PLACE SEARCH (Nominatim + Unsplash) ---------- */
$('#search-input').addEventListener('input', e => {
  const q = e.target.value.trim();
  clearTimeout(searchTimer);
  if (!q) { $('#search-results').innerHTML = ''; lastQuery = ''; return; }
  searchTimer = setTimeout(() => searchPlaces(q), 450);
});

async function searchPlaces(q) {
  if (q === lastQuery) return;
  lastQuery = q;
  const box = $('#search-results');
  box.innerHTML = `<div class="empty empty-sm"><span class="loader"></span></div>`;

  try {
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=8&addressdetails=1`;
    const res = await fetch(url, { headers: { 'Accept-Language': 'ko,en' } });
    const results = await res.json();
    if (q !== lastQuery) return;

    if (!results.length) {
      box.innerHTML = `<div class="empty empty-sm">검색 결과가 없습니다</div>`;
      return;
    }

    // 사진은 병렬로
    const withPhotos = await Promise.all(results.map(async r => {
      const queryName = r.name || r.display_name.split(',')[0];
      const photo = await fetchPhoto(queryName);
      return { ...r, _photo: photo };
    }));
    if (q !== lastQuery) return;

    box.innerHTML = `
      <div class="panel-header"><span class="panel-title">검색 결과</span></div>
      ${withPhotos.map(r => {
        const name = r.name || r.display_name.split(',')[0];
        const addr = r.display_name.split(',').slice(1, 3).join(',').trim();
        return `
          <div class="place-card" data-add data-name="${esc(name)}" data-addr="${esc(addr)}"
               data-lat="${r.lat}" data-lng="${r.lon}" data-photo="${esc(r._photo || '')}">
            <div class="place-thumb ${r._photo ? '' : 'placeholder'}"
                 ${r._photo ? `style="background-image:url('${esc(r._photo)}')"` : ''}>
              ${r._photo ? '' : '🗺'}
            </div>
            <div class="place-info">
              <div class="place-name">${esc(name)}</div>
              <div class="place-addr">${esc(addr)}</div>
            </div>
            <button class="btn btn-secondary btn-sm" data-add-btn>+ 저장</button>
          </div>
        `;
      }).join('')}
    `;

    box.querySelectorAll('[data-add]').forEach(el => {
      el.onclick = () => {
        savePlace({
          name: el.dataset.name,
          address: el.dataset.addr,
          lat: parseFloat(el.dataset.lat),
          lng: parseFloat(el.dataset.lng),
          photo_url: el.dataset.photo || null
        });
      };
    });
  } catch (err) {
    box.innerHTML = `<div class="empty empty-sm">검색 오류: ${esc(err.message)}</div>`;
  }
}

async function fetchPhoto(q) {
  if (!UNSPLASH_KEY || UNSPLASH_KEY === 'YOUR_UNSPLASH_ACCESS_KEY') return null;
  if (photoCache[q] !== undefined) return photoCache[q];
  try {
    const url = `https://api.unsplash.com/search/photos?query=${encodeURIComponent(q)}&per_page=1&orientation=landscape`;
    const res = await fetch(url, { headers: { Authorization: `Client-ID ${UNSPLASH_KEY}` } });
    if (!res.ok) { photoCache[q] = null; return null; }
    const data = await res.json();
    const photo = data?.results?.[0]?.urls?.small || null;
    photoCache[q] = photo;
    return photo;
  } catch {
    photoCache[q] = null;
    return null;
  }
}

async function savePlace(p) {
  // 중복 방지: 동일 좌표 이미 있으면 스킵
  const dup = savedPlaces.find(s => Math.abs(s.lat - p.lat) < 1e-6 && Math.abs(s.lng - p.lng) < 1e-6);
  if (dup) { toast('이미 저장된 장소입니다'); return; }

  const { error } = await sb.from('places').insert({
    trip_id: currentTrip.id,
    name: p.name,
    address: p.address,
    lat: p.lat,
    lng: p.lng,
    photo_url: p.photo_url,
    added_by: user.id
  });
  if (error) { toast(error.message); return; }
  toast(`${p.name} 저장됨`);
}

/* ---------- SAVED PLACES ---------- */
async function loadSavedPlaces() {
  const { data } = await sb.from('places')
    .select('*')
    .eq('trip_id', currentTrip.id)
    .order('created_at', { ascending: false });
  savedPlaces = data || [];
}

function renderSaved() {
  const list = $('#saved-list');
  $('#saved-count').textContent = savedPlaces.length;
  if (savedPlaces.length === 0) {
    list.innerHTML = `<div class="empty empty-sm">검색 결과를 저장하면 여기에 표시됩니다</div>`;
    return;
  }
  list.innerHTML = savedPlaces.map(p => `
    <div class="place-card" draggable="true" data-id="${p.id}">
      <div class="place-thumb ${p.photo_url ? '' : 'placeholder'}"
           ${p.photo_url ? `style="background-image:url('${esc(p.photo_url)}')"` : ''}>
        ${p.photo_url ? '' : '📍'}
      </div>
      <div class="place-info">
        <div class="place-name">${esc(p.name)}</div>
        <div class="place-addr">${esc(p.address || '')}</div>
      </div>
      <button class="btn-ghost btn-sm" data-del="${p.id}" title="삭제">×</button>
    </div>
  `).join('');

  list.querySelectorAll('[draggable]').forEach(el => {
    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/place-id', el.dataset.id);
      e.dataTransfer.effectAllowed = 'copy';
      el.style.opacity = '0.5';
    });
    el.addEventListener('dragend', () => { el.style.opacity = ''; });

    el.addEventListener('click', e => {
      const del = e.target.closest('[data-del]');
      if (del) {
        e.stopPropagation();
        if (confirm('삭제하시겠습니까?')) deletePlace(del.dataset.del);
        return;
      }
      const p = savedPlaces.find(x => x.id === el.dataset.id);
      if (p && map && p.lat) {
        map.setView([p.lat, p.lng], 15);
        const m = mapMarkers.find(mm => mm._placeId === p.id);
        if (m) m.openPopup();
      }
    });
  });
}

async function deletePlace(id) {
  const { error } = await sb.from('places').delete().eq('id', id);
  if (error) toast(error.message);
}

/* ---------- ITINERARY ---------- */
async function loadItinerary() {
  const { data } = await sb.from('itinerary_items')
    .select('*, places(*)')
    .eq('trip_id', currentTrip.id)
    .order('date', { ascending: true })
    .order('sort_order', { ascending: true });
  itinerary = data || [];
}

function renderItinerary() {
  const wrap = $('#itin-wrap');
  if (!currentTrip.start_date || !currentTrip.end_date) {
    wrap.innerHTML = `<div class="empty" style="margin:auto;">여행 날짜를 먼저 설정하세요</div>`;
    return;
  }
  const days = daysBetween(currentTrip.start_date, currentTrip.end_date);

  wrap.innerHTML = days.map((d, i) => {
    const items = itinerary.filter(it => it.date === d);
    const wd = WEEKDAY[new Date(d + 'T00:00:00').getDay()];
    return `
      <div class="day-col">
        <div class="day-head">
          <div>
            <div class="day-num">Day ${i + 1}</div>
            <div class="serif day-date">${esc(fmtDate(d))}</div>
          </div>
          <div class="day-weekday">${wd}요일</div>
        </div>
        <div class="day-items" data-date="${d}">
          ${items.length === 0
            ? '<div class="day-empty">여기로 장소를 끌어다 놓으세요</div>'
            : items.map(it => `
                <div class="itin-item" data-id="${it.id}">
                  <div class="itin-item-body">
                    <div class="itin-item-name">${esc(it.places?.name || it.title || '(삭제된 장소)')}</div>
                    ${it.places?.address ? `<div class="itin-item-time">${esc(it.places.address.split(',')[0])}</div>` : ''}
                  </div>
                  <button class="itin-x" data-del-itin="${it.id}" title="삭제">×</button>
                </div>
              `).join('')
          }
        </div>
      </div>
    `;
  }).join('');

  // Drop targets
  wrap.querySelectorAll('.day-items').forEach(el => {
    el.addEventListener('dragover', e => {
      if (e.dataTransfer.types.includes('text/place-id')) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        el.classList.add('drag-over');
      }
    });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', async e => {
      e.preventDefault();
      el.classList.remove('drag-over');
      const placeId = e.dataTransfer.getData('text/place-id');
      if (!placeId) return;
      const existing = itinerary.filter(it => it.date === el.dataset.date);
      const { error } = await sb.from('itinerary_items').insert({
        trip_id: currentTrip.id,
        place_id: placeId,
        date: el.dataset.date,
        sort_order: existing.length,
        added_by: user.id
      });
      if (error) toast(error.message);
    });
  });

  // Delete
  wrap.querySelectorAll('[data-del-itin]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      const { error } = await sb.from('itinerary_items').delete().eq('id', b.dataset.delItin);
      if (error) toast(error.message);
    };
  });
}

/* ---------- MAP ---------- */
function ensureMap() {
  if (mapInited) return;
  setTimeout(() => {
    const el = document.getElementById('map');
    if (!el) return;
    map = L.map(el, { zoomControl: true, attributionControl: true })
           .setView([13.7563, 100.5018], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 19
    }).addTo(map);
    mapInited = true;
    renderMarkers();
  }, 80);
}

function renderMarkers() {
  if (!map) return;
  mapMarkers.forEach(m => m.remove());
  mapMarkers = [];
  const pts = [];
  savedPlaces.forEach(p => {
    if (p.lat == null || p.lng == null) return;
    const m = L.marker([p.lat, p.lng]).addTo(map);
    m._placeId = p.id;
    m.bindPopup(`<b>${esc(p.name)}</b><br/><span style="color:#6B6B68">${esc(p.address || '')}</span>`);
    mapMarkers.push(m);
    pts.push([p.lat, p.lng]);
  });
  if (pts.length > 0) {
    map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
  }
}

/* ---------- REALTIME ---------- */
function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel(`trip-${currentTrip.id}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'places', filter: `trip_id=eq.${currentTrip.id}` }, async () => {
      await loadSavedPlaces();
      renderSaved();
      renderMarkers();
      await loadItinerary();   // places가 조인되므로 같이 갱신
      renderItinerary();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'itinerary_items', filter: `trip_id=eq.${currentTrip.id}` }, async () => {
      await loadItinerary();
      renderItinerary();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trip_members', filter: `trip_id=eq.${currentTrip.id}` }, async () => {
      await loadMembers();
    })
    .subscribe();
}

/* ---------- MOBILE TABS ---------- */
$$('.mobile-tab').forEach(t => {
  t.onclick = () => {
    $$('.mobile-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('#panel-left').classList.toggle('m-active', t.dataset.tab === 'places');
    $('#panel-right').classList.toggle('m-active', t.dataset.tab === 'map');
    // 'itin'은 가운데 패널이 기본으로 보임
    if (t.dataset.tab === 'map' && map) setTimeout(() => map.invalidateSize(), 100);
  };
});

/* ---------- MODAL CLOSE ---------- */
$$('[data-close]').forEach(b => b.onclick = () => b.closest('.modal-bg').classList.remove('active'));
$$('.modal-bg').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.modal-bg.active').forEach(m => m.classList.remove('active'));
});

/* ---------- GO ---------- */
bootstrap();
