<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>여로 · Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #FAFAF7; --surface: #FFFFFF; --ink: #1A1A1A;
    --mute: #6B6B68; --mute-2: #A8A8A3;
    --line: #EAE8E2; --line-2: #D6D4CD;
    --accent: #0F4C5C; --accent-h: #0a3a47;
    --warm: #C26B3D; --error: #B23A3A;
    --r: 6px; --r-l: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-l: 0 8px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; letter-spacing: -0.01em; }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border-radius: var(--r); font-weight: 500; font-size: 13px;
    transition: all .15s; white-space: nowrap; user-select: none; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #000; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
  .btn-secondary:hover { border-color: var(--ink); }
  .btn-ghost { color: var(--mute); padding: 8px 10px; }
  .btn-ghost:hover { color: var(--ink); background: var(--bg); border-radius: var(--r); }
  .btn-block { width: 100%; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-xs { padding: 3px 8px; font-size: 11px; gap: 4px; }

  .input { width: 100%; padding: 10px 12px; border-radius: var(--r);
    border: 1px solid var(--line-2); background: var(--surface); transition: border-color .15s; }
  .input:focus { outline: none; border-color: var(--ink); }
  .input::placeholder { color: var(--mute-2); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 500; margin-bottom: 6px;
    color: var(--mute); letter-spacing: 0.04em; text-transform: uppercase; }
  .row { display: flex; gap: 12px; }
  .row > .field { flex: 1; }

  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; }

  /* AUTH */
  #screen-auth { flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--surface); border-radius: var(--r-l);
    padding: 36px 32px; border: 1px solid var(--line); }
  .auth-title { font-size: 44px; line-height: 1; margin: 0 0 8px; }
  .auth-subtitle { color: var(--mute); margin: 0 0 24px; font-size: 14px; }

  /* TRIPS LIST */
  #screen-trips { flex-direction: column; padding: 48px 24px 80px; align-items: center; }
  .trips-wrap { width: 100%; max-width: 720px; }
  .page-header { display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .page-title { font-size: 52px; line-height: 1; margin: 0; }
  .header-actions { display: flex; gap: 8px; }
  .trip-card { display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-l); margin-bottom: 10px; cursor: pointer; transition: border-color .15s; }
  .trip-card:hover { border-color: var(--ink); }
  .trip-card h3 { font-family: 'Instrument Serif', serif; font-size: 26px; font-weight: 400; margin: 0 0 4px; }
  .trip-card .meta { color: var(--mute); font-size: 13px; }
  .trip-card .arrow { color: var(--mute-2); font-size: 18px; }

  /* APP */
  #screen-app { flex-direction: column; height: 100vh; overflow: hidden; }
  .app-header { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface);
    flex-shrink: 0; gap: 12px; }
  .h-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .h-right { display: flex; align-items: center; gap: 10px; }
  .trip-name { font-size: 22px; line-height: 1.1; }
  .trip-meta { color: var(--mute); font-size: 12px; }
  .member-stack { display: flex; }
  .avatar { width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; border: 2px solid var(--surface); margin-left: -8px;
    background-size: cover; background-position: center; color: #fff; }
  .avatar:first-child { margin-left: 0; }

  .app-body { display: flex; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; overflow: hidden; background: var(--surface); }
  .panel-left { width: 340px; border-right: 1px solid var(--line); flex-shrink: 0; }
  .panel-center { flex: 1; min-width: 0; background: var(--bg); }

  /* MAP TOGGLE (오버레이) */
  .map-overlay {
    display: none; position: fixed; inset: 53px 0 0 340px; background: var(--surface);
    z-index: 50; flex-direction: column;
  }
  .map-overlay.active { display: flex; }
  .map-overlay-head {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  #map { flex: 1; width: 100%; background: var(--line); }

  .panel-header { padding: 12px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; background: var(--surface); }
  .panel-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--mute); }
  .panel-count { font-size: 11px; color: var(--mute-2); font-weight: 500; }
  .panel-content { flex: 1; overflow-y: auto; }

  /* SEARCH PANEL */
  .search-wrap { padding: 14px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--surface); z-index: 2; }
  .search-help {
    font-size: 11px; color: var(--mute); margin-bottom: 8px; line-height: 1.5;
  }
  .search-help b { color: var(--ink); font-weight: 600; }
  .search-box { position: relative; }
  .search-input { width: 100%; padding: 10px 12px 10px 34px; border-radius: var(--r);
    border: 1px solid var(--line-2); background: var(--bg); transition: all .15s; }
  .search-input:focus { outline: none; background: var(--surface); border-color: var(--ink); }
  .search-icon { position: absolute; left: 10px; top: 11px; color: var(--mute-2); pointer-events: none; }
  .manual-add {
    margin-top: 8px; padding: 8px; border: 1px dashed var(--line-2); border-radius: var(--r);
    text-align: center; font-size: 12px; color: var(--mute); cursor: pointer; transition: all .15s;
  }
  .manual-add:hover { border-color: var(--accent); color: var(--accent); }

  /* PLACE CARDS */
  .place-card { display: flex; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line);
    transition: background .15s; position: relative; align-items: center; }
  .place-card:hover { background: var(--bg); }
  .place-thumb { width: 60px; height: 60px; border-radius: var(--r);
    background: var(--line) center/cover no-repeat; flex-shrink: 0; }
  .place-thumb.placeholder { display: flex; align-items: center; justify-content: center;
    color: var(--mute-2); font-size: 20px; }
  .place-info { flex: 1; min-width: 0; }
  .place-name { font-weight: 500; font-size: 13px; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place-addr { font-size: 11.5px; color: var(--mute);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .place-actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; align-items: flex-end; }
  .place-card-buttons { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 14px 12px; }

  /* DASHBOARD */
  .dashboard {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    padding: 18px 18px 0; max-width: 900px;
  }
  .dash-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-l); padding: 14px 16px;
  }
  .dash-label { font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--mute); margin-bottom: 4px; }
  .dash-value { font-family: 'Instrument Serif', serif; font-size: 28px; line-height: 1; }
  .dash-sub { font-size: 11px; color: var(--mute); margin-top: 4px; }

  /* ITINERARY - 노션 스타일 세로 아코디언 */
  .itin-wrap { padding: 18px; overflow-y: auto; height: 100%; max-width: 900px; }
  .day-block {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-l); margin-bottom: 10px; overflow: hidden;
  }
  .day-header {
    padding: 14px 18px; cursor: pointer; display: flex;
    align-items: center; justify-content: space-between;
    user-select: none; transition: background .15s;
  }
  .day-header:hover { background: var(--bg); }
  .day-header-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  .day-chevron {
    color: var(--mute-2); font-size: 12px; transition: transform .15s;
    width: 12px; display: inline-block;
  }
  .day-block.collapsed .day-chevron { transform: rotate(-90deg); }
  .day-block.collapsed .day-body { display: none; }
  .day-num { font-size: 10px; font-weight: 600; letter-spacing: 0.1em;
    color: var(--accent); text-transform: uppercase; }
  .day-title { font-family: 'Instrument Serif', serif; font-size: 22px; line-height: 1; }
  .day-weekday { color: var(--mute); font-size: 12px; }
  .day-stats { color: var(--mute); font-size: 12px; }

  .day-body { padding: 0 18px 14px; border-top: 1px solid var(--line); }
  .itin-item {
    display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
    align-items: flex-start;
  }
  .itin-item:last-child { border-bottom: none; }
  .itin-time {
    width: 60px; flex-shrink: 0; font-size: 13px; color: var(--ink); font-weight: 500;
    padding-top: 2px;
  }
  .itin-time input {
    width: 60px; padding: 4px; border: 1px solid transparent; border-radius: 4px;
    background: transparent; font-size: 13px; font-weight: 500;
  }
  .itin-time input:hover { border-color: var(--line-2); }
  .itin-time input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .itin-content { flex: 1; min-width: 0; }
  .itin-place {
    font-weight: 500; font-size: 14px; margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .itin-place-addr { font-size: 11.5px; color: var(--mute); margin-bottom: 6px; }
  .itin-memo {
    width: 100%; padding: 6px 8px; border: 1px solid transparent; border-radius: 4px;
    font-size: 12.5px; color: var(--mute); background: transparent;
    resize: none; font-family: inherit; min-height: 22px;
  }
  .itin-memo:hover { border-color: var(--line-2); background: var(--bg); }
  .itin-memo:focus { outline: none; border-color: var(--accent); background: var(--surface); color: var(--ink); }
  .itin-cost {
    width: 80px; flex-shrink: 0; text-align: right; font-size: 12px; color: var(--mute);
  }
  .itin-cost input {
    width: 70px; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px;
    background: transparent; font-size: 12px; text-align: right;
  }
  .itin-cost input:hover { border-color: var(--line-2); }
  .itin-cost input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
  .itin-x {
    color: var(--mute-2); padding: 4px; border-radius: 4px; line-height: 1;
    font-size: 16px; flex-shrink: 0; align-self: flex-start;
  }
  .itin-x:hover { color: var(--error); background: rgba(178,58,58,0.08); }

  .day-empty { color: var(--mute-2); font-size: 12px; padding: 16px 0; text-align: center; }
  .day-add {
    margin-top: 8px; padding: 8px 12px; border: 1px dashed var(--line-2);
    border-radius: var(--r); font-size: 12px; color: var(--mute);
    text-align: center; cursor: pointer; transition: all .15s;
  }
  .day-add:hover { border-color: var(--accent); color: var(--accent); }

  /* MAP */
  .leaflet-popup-content { font-family: inherit; font-size: 13px; }
  .leaflet-popup-content img { border-radius: 4px; margin-bottom: 6px; max-width: 180px; }

  /* MODAL */
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
  .modal-bg.active { display: flex; animation: fadein .15s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--surface); border-radius: var(--r-l); max-width: 480px;
    width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; box-shadow: var(--shadow-l); }
  .modal h2 { font-family: 'Instrument Serif', serif; font-size: 30px; font-weight: 400; margin: 0 0 6px; }
  .modal .lede { color: var(--mute); margin: 0 0 20px; font-size: 13px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .day-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .day-pick-btn {
    padding: 8px 14px; border: 1px solid var(--line-2); border-radius: var(--r);
    font-size: 13px; cursor: pointer; transition: all .15s; text-align: center; min-width: 80px;
  }
  .day-pick-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(15,76,92,0.06); }

  .empty { padding: 40px 20px; text-align: center; color: var(--mute-2); font-size: 13px; }
  .empty-sm { padding: 20px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: var(--r);
    font-size: 13px; z-index: 2000; opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; box-shadow: var(--shadow-l); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .loader { display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--line-2); border-top-color: var(--ink);
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 820px) {
    .panel-left { display: none; }
    .panel-left.m-active { display: flex; position: fixed; inset: 53px 0 0 0; width: 100%; z-index: 50; }
    .map-overlay { inset: 53px 0 0 0; }
    .dashboard { grid-template-columns: repeat(2, 1fr); }
    .itin-time, .itin-cost { width: auto; }
    .itin-item { flex-wrap: wrap; }
    .page-title { font-size: 36px; }
    .auth-title { font-size: 36px; }
    .mobile-toggle {
      display: flex; position: fixed; bottom: 16px; right: 16px; gap: 8px; z-index: 200;
    }
    .mobile-toggle button {
      background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 999px;
      font-size: 12px; font-weight: 500; box-shadow: var(--shadow-l);
    }
  }
  .mobile-toggle { display: none; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="screen-auth" class="screen active">
  <div class="auth-card">
    <h1 class="serif auth-title">여로</h1>
    <p class="auth-subtitle">친구들과 함께 짜는 여행 계획</p>
    <button class="btn btn-block" id="btn-google"
            style="background:#fff; color:#1A1A1A; border:1px solid var(--line-2); gap:10px; padding:11px 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
      </svg>
      Google로 계속하기
    </button>
    <p style="font-size: 12px; color: var(--mute); margin: 16px 0 0; text-align: center;">
      구글 계정으로 안전하게 로그인합니다
    </p>
  </div>
</div>

<!-- TRIPS -->
<div id="screen-trips" class="screen">
  <div class="trips-wrap">
    <div class="page-header">
      <h1 class="serif page-title">나의 여행</h1>
      <div class="header-actions">
        <button class="btn btn-secondary" id="btn-join">초대 코드</button>
        <button class="btn btn-primary" id="btn-new-trip">+ 새 여행</button>
      </div>
    </div>
    <div id="trips-list"></div>
    <div style="margin-top: 32px; text-align: center;">
      <button class="btn btn-ghost" id="btn-logout">로그아웃</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="screen-app" class="screen">
  <header class="app-header">
    <div class="h-left">
      <button class="btn btn-ghost" id="btn-back" title="여행 목록">←</button>
      <div style="min-width: 0;">
        <div class="serif trip-name" id="current-name"></div>
        <div class="trip-meta" id="current-meta"></div>
      </div>
    </div>
    <div class="h-right">
      <div class="member-stack" id="member-stack"></div>
      <button class="btn btn-secondary btn-sm" id="btn-map-toggle">🗺 지도</button>
      <button class="btn btn-secondary btn-sm" id="btn-invite">초대</button>
    </div>
  </header>

  <div class="app-body">
    <aside class="panel panel-left" id="panel-left">
      <div class="search-wrap">
        <div class="search-help">
          구글맵·네이버지도에서 장소를 찾아 <b>주소창 URL을 복사 → 아래에 붙여넣기</b>
        </div>
        <div class="search-box">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
          </svg>
          <input type="text" class="search-input" id="paste-input" placeholder="지도 링크 붙여넣기" />
        </div>
        <div class="manual-add" id="btn-manual-add">+ 직접 입력으로 추가</div>
      </div>
      <div class="panel-content">
        <div class="panel-header">
          <span class="panel-title">저장한 장소</span>
          <span class="panel-count" id="saved-count">0</span>
        </div>
        <div id="saved-list"></div>
      </div>
    </aside>

    <main class="panel panel-center">
      <div class="dashboard" id="dashboard"></div>
      <div class="itin-wrap" id="itin-wrap"></div>
    </main>

    <div class="map-overlay" id="map-overlay">
      <div class="map-overlay-head">
        <div>
          <div class="panel-title" style="margin-bottom: 2px;">지도</div>
          <div style="font-size: 12px; color: var(--mute);" id="map-status">저장한 장소가 표시됩니다</div>
        </div>
        <button class="btn btn-ghost" id="btn-map-close">닫기 ×</button>
      </div>
      <div id="map"></div>
    </div>

    <div class="mobile-toggle">
      <button id="btn-mobile-search">🔍</button>
      <button id="btn-mobile-map">🗺</button>
    </div>
  </div>
</div>

<!-- MODALS -->
<div class="modal-bg" id="modal-new-trip">
  <div class="modal">
    <h2>새 여행 만들기</h2>
    <p class="lede">언제 어디로 떠나시나요?</p>
    <div class="field"><label>여행 이름</label><input type="text" class="input" id="nt-name" placeholder="방콕 · 푸켓" /></div>
    <div class="row">
      <div class="field"><label>시작일</label><input type="date" class="input" id="nt-start" /></div>
      <div class="field"><label>종료일</label><input type="date" class="input" id="nt-end" /></div>
    </div>
    <div class="modal-actions">

const SUPABASE_URL = 'https://izmlenodqnvisymjnlyg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_v_ScByLsW_mC5Pzoyx1iAw_J2V0SGkR';

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), ms);

function showScreen(id) { $$('.screen').forEach(s => s.classList.remove('active')); $('#' + id).classList.add('active'); }

function closeModal(id) { $('#' + id).classList.remove('active'); }
function fmtDate(d) { if (!d) return ''; const dt = new Date(d + 'T00:00:00'); return `${dt.getMonth()+1}월 ${dt.getDate()}일`; }
function fmtDateRange(s, e) { if (!s && !e) return '날짜 미정'; if (!s) return `~ ${fmtDate(e)}`; if (!e) return `${fmtDate(s)} ~`; return `${fmtDate(s)} – ${fmtDate(e)}`; }
function daysBetween(s, e) {
  const start = new Date(s + 'T00:00:00'), end = new Date(e + 'T00:00:00'), out = [], cur = new Date(start);
  while (cur <= end) { out.push(cur.toISOString().split('T')[0]); cur.setDate(cur.getDate() + 1); }
  return out;
}
function daysUntil(d) {
  if (!d) return null;
  const target = new Date(d + 'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((target - today) / (1000*60*60*24));
}

function avatarColor(id) {

}

/* ============== 지도 링크 파싱 (구글맵/네이버맵) ============== */
function parseMapLink(input) {
  const url = input.trim();
  
  // 구글맵 - 좌표 + 이름
  // https://www.google.com/maps/place/장소이름/@13.7226,100.4928,17z/...
  // https://maps.app.goo.gl/... (단축 URL은 좌표 추출 불가)
  // https://goo.gl/maps/...
  
  let m;
  
  // 패턴 1: /maps/place/<name>/@<lat>,<lng>
  m = url.match(/\/maps\/place\/([^/]+)\/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) {
    return {
      name: decodeURIComponent(m[1]).replace(/\+/g, ' '),
      lat: parseFloat(m[2]),
      lng: parseFloat(m[3])
    };
  }
  
  // 패턴 2: 좌표만 있는 경우 @<lat>,<lng>
  m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) {
    return {
      name: null,
      lat: parseFloat(m[1]),
      lng: parseFloat(m[2])
    };
  }
  
  // 패턴 3: 구글맵 query
  // https://www.google.com/maps?q=lat,lng
  m = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) return { name: null, lat: parseFloat(m[1]), lng: parseFloat(m[2]) };
  
  // 패턴 4: 네이버 지도 - https://map.naver.com/v5/entry/place/12345 또는 /v5/search/xxx
  // 네이버는 URL에 좌표가 안 들어있는 경우 많음. 그래서 search/<name>만 추출
  m = url.match(/map\.naver\.com\/[v\d]+\/search\/([^/?]+)/);
  if (m) {
    return { name: decodeURIComponent(m[1]).replace(/\+/g, ' '), lat: null, lng: null };
  }
  m = url.match(/map\.naver\.com.*[?&]query=([^&]+)/);
  if (m) {
    return { name: decodeURIComponent(m[1]).replace(/\+/g, ' '), lat: null, lng: null };
  }
  
  // 패턴 5: 네이버 단축 URL - https://naver.me/xxx (좌표 추출 불가)
  if (/naver\.me\//.test(url) || /maps\.app\.goo\.gl/.test(url) || /goo\.gl\/maps/.test(url)) {
    return { error: '단축 URL은 좌표 추출이 안 됩니다. 지도 앱에서 원본 URL을 복사해주세요.' };
  }
  
  return null;
}

async function handleSignedIn(u) {
  user = u;
  if (location.hash || location.search.includes('access_token') || location.search.includes('code=')) {
    history.replaceState({}, '', location.pathname);
  }
  await processPendingInvite();
  await loadTrips();

}

async function processPendingInvite() {
  const fromUrl = new URLSearchParams(location.search).get('join');
  const fromLS = localStorage.getItem('pending_join');
  const code = fromUrl || fromLS;
  if (!code) return;
  const { error } = await sb.rpc('join_trip_by_code', { _code: code });
  if (!error) toast('여행에 합류했습니다');
  localStorage.removeItem('pending_join');
  if (fromUrl) history.replaceState({}, '', location.pathname);
}

async function savePlace(p) {

    const dup = savedPlaces.find(s => s.lat != null && Math.abs(s.lat - p.lat) < 1e-6 && Math.abs(s.lng - p.lng) < 1e-6);
    if (dup) { toast('이미 저장된 장소입니다'); return; }
  }
  const uid = await currentUid();
  if (!uid) { toast('다시 로그인해주세요.'); return; }
  const { error } = await sb.from('places').insert({
    trip_id: currentTrip.id, name: p.name, address: p.address,
    lat: p.lat, lng: p.lng, photo_url: p.photo_url, added_by: uid
  });
  if (error) { toast(error.message); return; }
  toast(`${p.name} 저장됨`);
}

      </div>
      <div class="place-card-buttons">
        <a class="btn btn-secondary btn-xs" href="${googleMapsLink(p)}" target="_blank" rel="noopener">구글맵</a>
        <a class="btn btn-secondary btn-xs" href="${naverMapsLink(p)}" target="_blank" rel="noopener">네이버맵</a>
        <button class="btn btn-secondary btn-xs" data-add-itin="${p.id}">+ 일정</button>
        ${p.lat != null ? `<button class="btn btn-secondary btn-xs" data-show-map="${p.id}">지도</button>` : ''}
      </div>
    </div>
  `).join('');

  list.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = async (e) => { e.stopPropagation(); if (confirm('삭제하시겠습니까?')) await sb.from('places').delete().eq('id', b.dataset.del); };
  });
  list.querySelectorAll('[data-add-itin]').forEach(b => {
    b.onclick = () => showAddToDayModal(b.dataset.addItin);
  });
  list.querySelectorAll('[data-show-map]').forEach(b => {
    b.onclick = () => {
      const p = savedPlaces.find(x => x.id === b.dataset.showMap);
      if (!p) return;
      openMap();
      setTimeout(() => {
        if (map && p.lat) {
          map.setView([p.lat, p.lng], 15);
          const mk = mapMarkers.find(mm => mm._placeId === p.id);
          if (mk) mk.openPopup();
        }
      }, 200);
    };
  });
}

function showAddToDayModal(placeId) {
  const place = savedPlaces.find(p => p.id === placeId);
  if (!place || !currentTrip.start_date || !currentTrip.end_date) {
    toast('여행 날짜를 먼저 설정하세요'); return;
  }
  pendingAddPlace = placeId;
  $('#add-day-place-name').textContent = `"${place.name}"을(를) 어느 날에 추가할까요?`;
  const days = daysBetween(currentTrip.start_date, currentTrip.end_date);
  const picker = $('#day-picker');
  picker.innerHTML = days.map((d, i) => {
    const wd = WEEKDAY[new Date(d + 'T00:00:00').getDay()];
    return `<button class="day-pick-btn" data-date="${d}">Day ${i+1}<br/><span style="font-size:11px;color:var(--mute)">${fmtDate(d)} ${wd}</span></button>`;
  }).join('');
  picker.querySelectorAll('.day-pick-btn').forEach(btn => {
    btn.onclick = async () => {
      const uid = await currentUid();
      if (!uid) { toast('다시 로그인해주세요.'); return; }
      const existing = itinerary.filter(it => it.date === btn.dataset.date);
      const { error } = await sb.from('itinerary_items').insert({
        trip_id: currentTrip.id, place_id: pendingAddPlace,
        date: btn.dataset.date, sort_order: existing.length, added_by: uid
      });
      if (error) toast(error.message); else toast('일정에 추가했습니다');
      closeModal('modal-add-day');
    };
  });
  openModal('modal-add-day');
}

/* ============== ITINERARY ============== */
async function loadItinerary() {
  const { data } = await sb.from('itinerary_items')
    .select('*, places(*)').eq('trip_id', currentTrip.id)
    .order('date', { ascending: true }).order('sort_order', { ascending: true });
  itinerary = data || [];
}

function renderDashboard() {
  const dash = $('#dashboard');
  if (!currentTrip.start_date) {
    dash.innerHTML = '';
    return;
  }
  const dd = daysUntil(currentTrip.start_date);
  const totalDays = currentTrip.end_date ? daysBetween(currentTrip.start_date, currentTrip.end_date).length : 1;
  const totalCost = itinerary.reduce((sum, it) => sum + (it.estimated_cost || 0), 0);
  const placedCount = itinerary.length;
  const savedCount = savedPlaces.length;

  dash.innerHTML = `
    <div class="dash-card">
      <div class="dash-label">D-Day</div>
      <div class="dash-value">${dd > 0 ? `D-${dd}` : (dd === 0 ? '오늘' : `D+${-dd}`)}</div>
      <div class="dash-sub">${totalDays}일 일정</div>
    </div>
    <div class="dash-card">
      <div class="dash-label">장소</div>
      <div class="dash-value">${savedCount}<span style="font-size:14px;color:var(--mute)"> / 일정 ${placedCount}</span></div>
      <div class="dash-sub">저장 / 배치됨</div>
    </div>
    <div class="dash-card">
      <div class="dash-label">예상 비용</div>
      <div class="dash-value">${totalCost.toLocaleString()}<span style="font-size:14px;color:var(--mute)"> ₩</span></div>
      <div class="dash-sub">일정 합산</div>
    </div>
  `;
}

function renderItinerary() {
  const wrap = $('#itin-wrap');
  if (!currentTrip.start_date || !currentTrip.end_date) {
    wrap.innerHTML = '<div class="empty" style="margin:auto;">여행 날짜를 먼저 설정하세요</div>';
    return;
  }
  const days = daysBetween(currentTrip.start_date, currentTrip.end_date);
  wrap.innerHTML = days.map((d, i) => {
    const items = itinerary.filter(it => it.date === d).sort((a,b) => (a.sort_order||0) - (b.sort_order||0));
    const wd = WEEKDAY[new Date(d + 'T00:00:00').getDay()];
    const collapsed = collapsedDays.has(d);
    const dayCost = items.reduce((s, it) => s + (it.estimated_cost || 0), 0);
    return `
      <div class="day-block ${collapsed ? 'collapsed' : ''}" data-date="${d}">
        <div class="day-header" data-toggle="${d}">
          <div class="day-header-left">
            <span class="day-chevron">▼</span>
            <div>
              <div class="day-num">Day ${i+1}</div>
              <div class="day-title">${fmtDate(d)} <span style="font-size:13px;color:var(--mute);font-family:Inter">${wd}요일</span></div>
            </div>
          </div>
          <div class="day-stats">${items.length}개 · ${dayCost.toLocaleString()}₩</div>
        </div>
        <div class="day-body">
          ${items.length === 0
            ? '<div class="day-empty">아직 일정이 없습니다. 저장한 장소에서 + 일정 버튼을 누르세요.</div>'
            : items.map(it => `
                <div class="itin-item" data-id="${it.id}">
                  <div class="itin-time">
                    <input type="time" data-field="start_time" data-id="${it.id}" value="${it.start_time ? it.start_time.substring(0,5) : ''}" placeholder="시간" />
                  </div>
                  <div class="itin-content">
                    <div class="itin-place">${esc(it.places?.name || it.title || '(삭제된 장소)')}</div>
                    ${it.places?.address ? `<div class="itin-place-addr">${esc(it.places.address)}</div>` : ''}
                    <textarea class="itin-memo" data-field="notes" data-id="${it.id}" placeholder="메모..." rows="1">${esc(it.notes || '')}</textarea>
                  </div>
                  <div class="itin-cost">
                    <input type="number" data-field="estimated_cost" data-id="${it.id}" value="${it.estimated_cost || ''}" placeholder="0" />
                    <div style="font-size:10px;color:var(--mute-2);margin-top:2px;">₩</div>
                  </div>
                  <button class="itin-x" data-del-itin="${it.id}" title="삭제">×</button>
                </div>`).join('')
          }
        </div>
      </div>`;
  }).join('');

  // Day 토글
  wrap.querySelectorAll('[data-toggle]').forEach(h => {
    h.onclick = () => {
      const d = h.dataset.toggle;
      if (collapsedDays.has(d)) collapsedDays.delete(d);
      else collapsedDays.add(d);
      h.closest('.day-block').classList.toggle('collapsed');
    };
  });

  // 인라인 편집 - 자동 저장
  wrap.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('change', async () => {
      const field = el.dataset.field;
      const id = el.dataset.id;
      let value = el.value;
      if (field === 'estimated_cost') value = value ? parseInt(value) : null;
      if (field === 'start_time') value = value || null;
      const { error } = await sb.from('itinerary_items').update({ [field]: value }).eq('id', id);
      if (error) toast(error.message);
    });
    // 메모 textarea 자동 높이
    if (el.tagName === 'TEXTAREA') {
      const adjust = () => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };
      el.addEventListener('input', adjust);
      adjust();
    }
  });

  // 삭제
  wrap.querySelectorAll('[data-del-itin]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation();
      const { error } = await sb.from('itinerary_items').delete().eq('id', b.dataset.delItin);
      if (error) toast(error.message);
    };
  });
}

/* ============== MAP ============== */
function openMap() {
  $('#map-overlay').classList.add('active');
  if (!mapInited) ensureMap();
  else setTimeout(() => map?.invalidateSize(), 50);
}
$('#btn-map-toggle').onclick = openMap;
$('#btn-map-close').onclick = () => $('#map-overlay').classList.remove('active');

function ensureMap() {
  if (mapInited) return;
  setTimeout(() => {
    const el = document.getElementById('map'); if (!el) return;
    map = L.map(el, { zoomControl: true }).setView([20, 100], 2);
    // CartoDB Voyager - 깔끔하고 영어 라벨
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '© OpenStreetMap © CARTO', maxZoom: 19, subdomains: 'abcd'
    }).addTo(map);
    mapInited = true;
    renderMarkers();
  }, 80);
}

function renderMarkers() {
  if (!map) return;
  mapMarkers.forEach(m => m.remove()); mapMarkers = [];
  const pts = [];
  savedPlaces.forEach(p => {
    if (p.lat == null || p.lng == null) return;
    const popup = `<b>${esc(p.name)}</b><br/>
      <span style="color:#6B6B68">${esc(p.address || '')}</span><br/>
      <div style="margin-top:6px;display:flex;gap:4px;">
        <a href="${googleMapsLink(p)}" target="_blank" style="color:#0F4C5C;font-size:11px">구글맵</a> ·
        <a href="${naverMapsLink(p)}" target="_blank" style="color:#0F4C5C;font-size:11px">네이버맵</a>
      </div>`;
    const m = L.marker([p.lat, p.lng]).addTo(map);
    m._placeId = p.id;
    m.bindPopup(popup, { maxWidth: 220 });
    mapMarkers.push(m);
    pts.push([p.lat, p.lng]);
  });
  const status = $('#map-status');
  if (pts.length > 0) {
    map.fitBounds(pts, { padding: [40, 40], maxZoom: 14 });
    if (status) status.textContent = `${pts.length}개 장소`;
  } else {
    if (status) status.textContent = '저장한 장소 중 좌표가 있는 것이 없습니다';
  }
}

/* ============== REALTIME ============== */
function subscribeRealtime() {
  if (realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel(`trip-${currentTrip.id}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'places', filter: `trip_id=eq.${currentTrip.id}` }, async () => {
      await loadSavedPlaces(); renderSaved(); renderMarkers();
      await loadItinerary(); renderItinerary(); renderDashboard();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'itinerary_items', filter: `trip_id=eq.${currentTrip.id}` }, async () => {
      await loadItinerary(); renderItinerary(); renderDashboard();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trip_members', filter: `trip_id=eq.${currentTrip.id}` }, async () => {
      await loadMembers();
    })
    .subscribe();
}

/* ============== MOBILE ============== */
$('#btn-mobile-search')?.addEventListener('click', () => $('#panel-left').classList.toggle('m-active'));
$('#btn-mobile-map')?.addEventListener('click', openMap);

/* ============== MODAL CLOSE ============== */
$$('[data-close]').forEach(b => b.onclick = () => b.closest('.modal-bg').classList.remove('active'));
$$('.modal-bg').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $$('.modal-bg.active').forEach(m => m.classList.remove('active')); $('#map-overlay').classList.remove('active'); }});

bootstrap();
</script>
